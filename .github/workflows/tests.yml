name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest jinja2
      - name: Unit tests
        run: python -m pytest -q
      - name: Every doctype / report JSON parses
        run: find cabinet_erp -name '*.json' -print0 | xargs -0 -n1 python -m json.tool > /dev/null
      - name: Demo data builds
        run: python scripts/build_demo_site.py
