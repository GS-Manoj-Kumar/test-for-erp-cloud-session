# Live preview: Frappe bench + MariaDB + Redis. Used by GitHub Codespaces / VS Code Dev Containers.
services:
  mariadb:
    image: docker.io/library/mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: "123"   # throwaway dev container only
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: docker.io/library/redis:7-alpine

  redis-queue:
    image: docker.io/library/redis:7-alpine

  frappe:
    image: docker.io/frappe/bench:latest
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

volumes:
  mariadb-data:
